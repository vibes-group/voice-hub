[package]
name = "voice-hub-desktop"
version = "0.5.3"
edition = "2024"
description = "Desktop shell for Voice Hub built with Tauri"

[lib]
name = "voice_hub_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
# Default "zip" only unpacks Tauri v1 updater bundles; releases ship the bare installer.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time"] }
rdev = "0.5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
url = "2"
