[package]
name = "taffy"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"
description = "Re-export the upstream Taffy patch release for GPUI's exact version pin"

[features]
default = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "calc", "content_size", "detailed_layout_info"]
alloc = ["taffy-fixed/alloc"]
block_layout = ["taffy-fixed/block_layout"]
calc = ["taffy-fixed/calc"]
content_size = ["taffy-fixed/content_size"]
debug = ["taffy-fixed/debug"]
detailed_layout_info = ["taffy-fixed/detailed_layout_info"]
flexbox = ["taffy-fixed/flexbox"]
grid = ["taffy-fixed/grid"]
profile = ["taffy-fixed/profile"]
serde = ["taffy-fixed/serde"]
std = ["taffy-fixed/std"]
strict_provenance = ["taffy-fixed/strict_provenance"]
taffy_tree = ["taffy-fixed/taffy_tree"]

[dependencies]
taffy-fixed = { package = "taffy", version = "=0.9.2", default-features = false }
