[package]
name = "voice-hub-gpui-beta"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Native Voice Hub desktop beta"

[workspace]
members = ["grid-compat", "release-sign"]
resolver = "2"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:cpal"]

[[bin]]
name = "voice-hub-gpui-beta"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
cpal = { version = "=0.18.2", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
gpui = { version = "=0.2.2", optional = true }
opus = "=0.4.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "json", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "=2.5.8"
base64 = "=0.23.1"
image = "=0.25.10"
minisign-verify = "=0.3.0"
semver = "=1.0.28"
sha2 = "=0.11.1"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
tokio-util = { version = "=0.7.20", features = ["io", "rt"] }
uuid = { version = "=1.29.0", features = ["v4"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
libwebrtc = "=0.4.0"
rdev = "=0.5.3"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[patch.crates-io]
# GPUI's pinned Taffy requires grid 0.18. Re-export the fixed implementation
# through a compatibility crate; no vulnerable grid source is included.
grid = { path = "grid-compat" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
