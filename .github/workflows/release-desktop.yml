name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1-test)'
        required: true
        default: 'v0.0.0-dev'

env:
  DESKTOP_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ steps.tag.outputs.is_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # This job holds the updater signing key, so it restores no caches: any branch can write them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (no tags upstream)
        with:
          toolchain: 1.98.1
          targets: ${{ env.DESKTOP_TARGET }}

      - name: Test desktop shell
        working-directory: src-tauri
        run: cargo test --target $env:DESKTOP_TARGET

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV=$(git tag --sort=-v:refname | grep -Fxv "${TAG}" | head -1 || true)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi

          LOG=$(git log --no-merges --format='%s' $RANGE \
            | grep -vE '^chore\(desktop\): bump' \
            | grep -vE '\[skip ci\]' || true)

          feats=$(echo "$LOG"  | grep -E  '^feat[!(:]'        | sed 's/^/- /' || true)
          fixes=$(echo "$LOG"  | grep -E  '^(fix|perf)[!(:]'  | sed 's/^/- /' || true)
          others=$(echo "$LOG" | grep -vE '^(feat|fix|perf)[!(:]' | sed 's/^/- /' || true)

          VERSION="${TAG#v}"
          INSTALLER="Voice.Hub_${VERSION}_x64-setup.exe"
          INSTALLER_URL="https://github.com/${REPO}/releases/download/${TAG}/${INSTALLER}"

          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Download'
            echo
            echo "**Windows:** [\`${INSTALLER}\`](${INSTALLER_URL})"
            echo
            if [ -n "$feats"  ]; then echo '## Features';    echo "$feats";  echo; fi
            if [ -n "$fixes"  ]; then echo '## Fixes';       echo "$fixes";  echo; fi
            if [ -n "$others" ]; then echo '## Other';       echo "$others"; echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ env.DESKTOP_TARGET }}
          updaterJsonPreferNsis: true

  publish-update-mirror:
    needs: build-windows
    if: ${{ needs.build-windows.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vibes-group/deploy
          ref: master
          persist-credentials: false

      - uses: ./.github/actions/setup-ssh
        with:
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir mirror
          gh release download "$TAG" --repo "$REPO" --dir mirror \
            --pattern 'latest.json' \
            --pattern '*.exe'

          installer=$(jq -r '.platforms["windows-x86_64"].url | split("/")[-1]' mirror/latest.json)
          test -n "$installer"
          test -f "mirror/$installer"

      - name: Publish server mirror
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          tar -C mirror -czf - . | ssh "deploy@$DEPLOY_HOST" \
            'docker run --rm -i -v voice-hub-updates:/updates busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e sh -eu -c '\''
              stage=$(mktemp -d)
              trap "rm -rf $stage" EXIT
              tar -xzf - -C "$stage"
              for file in "$stage"/*; do
                [ "$(basename "$file")" = latest.json ] && continue
                cp "$file" /updates/
                chmod 0644 "/updates/$(basename "$file")"
              done
              cp "$stage/latest.json" /updates/.latest.json.tmp
              chmod 0644 /updates/.latest.json.tmp
              mv /updates/.latest.json.tmp /updates/latest.json
              for existing in /updates/*; do
                name=$(basename "$existing")
                [ "$name" = latest.json ] && continue
                [ -f "$stage/$name" ] && continue
                rm -f "$existing"
              done
            '\'''
