name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1-test)'
        required: true
        default: 'v0.0.0-dev'

env:
  DESKTOP_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.DESKTOP_TARGET }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test desktop shell
        working-directory: src-tauri
        run: cargo test --target $env:DESKTOP_TARGET

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV=$(git tag --sort=-v:refname | grep -Fxv "${TAG}" | head -1 || true)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi

          LOG=$(git log --no-merges --format='%s' $RANGE \
            | grep -vE '^chore\(desktop\): bump' \
            | grep -vE '\[skip ci\]' || true)

          feats=$(echo "$LOG"  | grep -E  '^feat[!(:]'        | sed 's/^/- /' || true)
          fixes=$(echo "$LOG"  | grep -E  '^(fix|perf)[!(:]'  | sed 's/^/- /' || true)
          others=$(echo "$LOG" | grep -vE '^(feat|fix|perf)[!(:]' | sed 's/^/- /' || true)

          VERSION="${TAG#v}"
          INSTALLER="Voice.Hub_${VERSION}_x64-setup.exe"
          INSTALLER_URL="https://github.com/${REPO}/releases/download/${TAG}/${INSTALLER}"

          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Download'
            echo
            echo "**Windows:** [\`${INSTALLER}\`](${INSTALLER_URL})"
            echo
            if [ -n "$feats"  ]; then echo '## Features';    echo "$feats";  echo; fi
            if [ -n "$fixes"  ]; then echo '## Fixes';       echo "$fixes";  echo; fi
            if [ -n "$others" ]; then echo '## Other';       echo "$others"; echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ env.DESKTOP_TARGET }}
          updaterJsonPreferNsis: true

  mirror-to-server:
    needs: build-windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: vibes-group/infra
          ref: master

      - uses: ./.github/actions/setup-ssh
        with:
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir mirror
          gh release download "$TAG" --repo "$REPO" --dir mirror \
            --pattern 'latest.json' \
            --pattern '*.exe'

          installer=$(jq -r '.platforms["windows-x86_64"].url | split("/")[-1]' mirror/latest.json)
          test -n "$installer"
          test -f "mirror/$installer"

      - name: Publish server mirror
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          tar -C mirror -czf - . | ssh "deploy@$DEPLOY_HOST" \
            'docker run --rm -i -v voice-hub-updates:/updates busybox:1.37 sh -eu -c '\''
              stage=$(mktemp -d)
              trap "rm -rf $stage" EXIT
              tar -xzf - -C "$stage"
              for file in "$stage"/*; do
                [ "$(basename "$file")" = latest.json ] && continue
                cp "$file" /updates/
                chmod 0644 "/updates/$(basename "$file")"
              done
              cp "$stage/latest.json" /updates/.latest.json.tmp
              chmod 0644 /updates/.latest.json.tmp
              mv /updates/.latest.json.tmp /updates/latest.json
              for existing in /updates/*; do
                name=$(basename "$existing")
                [ "$name" = latest.json ] && continue
                [ -f "$stage/$name" ] && continue
                rm -f "$existing"
              done
            '\'''
