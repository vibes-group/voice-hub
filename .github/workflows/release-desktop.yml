name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1-test)'
        required: true
        default: 'v0.0.0-dev'

env:
  DESKTOP_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ steps.tag.outputs.is_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # This job holds the updater signing key, so it restores no caches: any branch can write them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (no tags upstream)
        with:
          toolchain: 1.98.1
          targets: ${{ env.DESKTOP_TARGET }}

      - name: Test desktop shell
        working-directory: src-tauri
        run: cargo test --target $env:DESKTOP_TARGET

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV=$(git tag --sort=-v:refname | grep -Fxv "${TAG}" | head -1 || true)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi

          LOG=$(git log --no-merges --format='%s' $RANGE \
            | grep -vE '^chore\(desktop\): bump' \
            | grep -vE '\[skip ci\]' || true)

          feats=$(echo "$LOG"  | grep -E  '^feat[!(:]'        | sed 's/^/- /' || true)
          fixes=$(echo "$LOG"  | grep -E  '^(fix|perf)[!(:]'  | sed 's/^/- /' || true)
          others=$(echo "$LOG" | grep -vE '^(feat|fix|perf)[!(:]' | sed 's/^/- /' || true)

          VERSION="${TAG#v}"
          INSTALLER="Voice.Hub_${VERSION}_x64-setup.exe"
          INSTALLER_URL="https://github.com/${REPO}/releases/download/${TAG}/${INSTALLER}"

          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Download'
            echo
            echo "**Windows:** [\`${INSTALLER}\`](${INSTALLER_URL})"
            echo
            echo "**GPUI beta (Windows, portable):** [\`Voice-Hub-GPUI-Beta_${TAG}_windows-x86_64.zip\`](https://github.com/${REPO}/releases/download/${TAG}/Voice-Hub-GPUI-Beta_${TAG}_windows-x86_64.zip)"
            echo 'Native GPUI client: voice with TURN, echo/noise processing, screen sharing, chat and attachments, participant controls, administration, tray, hotkeys and signed updates.'
            echo
            if [ -n "$feats"  ]; then echo '## Features';    echo "$feats";  echo; fi
            if [ -n "$fixes"  ]; then echo '## Fixes';       echo "$fixes";  echo; fi
            if [ -n "$others" ]; then echo '## Other';       echo "$others"; echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ env.DESKTOP_TARGET }}
          updaterJsonPreferNsis: true

  build-gpui-beta:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-windows.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (no tags upstream)
        with:
          toolchain: 1.99.1
          targets: ${{ env.DESKTOP_TARGET }}

      - name: Check dependency release ages
        run: python scripts/check-cargo-age.py src-gpui/Cargo.lock

      - name: Prepare verified native WebRTC SDK
        run: python scripts/prepare-webrtc.py --platform windows-x86_64 --github-env "$env:GITHUB_ENV"

      - name: Prepare verified fallback codecs
        run: python scripts/prepare-decoder.py --github-env "$env:GITHUB_ENV"

      - name: Find DirectX shader compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Windows SDK fxc.exe is required by GPUI' }
          "GPUI_FXC_PATH=$($compiler.FullName)" >> $env:GITHUB_ENV

      - name: Check and test GPUI beta
        working-directory: src-gpui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --check
          cargo clippy --locked --workspace --all-targets --target $env:DESKTOP_TARGET -- -D warnings
          cargo test --locked --workspace --target $env:DESKTOP_TARGET

      - name: Build GPUI beta
        working-directory: src-gpui
        env:
          APP_RELEASE_VERSION: ${{ needs.build-windows.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --target $env:DESKTOP_TARGET
          cargo test --locked --release -p grid@0.18.0 --target $env:DESKTOP_TARGET
          cargo build --locked --package voice-hub-release-sign --target $env:DESKTOP_TARGET

      - name: Sign GPUI update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $executable = "Voice-Hub-GPUI_${env:TAG}_windows-x86_64.exe"
          Copy-Item "src-gpui/target/$env:DESKTOP_TARGET/release/voice-hub-gpui-beta.exe" $executable
          & "src-gpui/target/$env:DESKTOP_TARGET/debug/voice-hub-release-sign.exe" $executable
          $manifest = @{
            version = $env:TAG.TrimStart('v')
            notes = 'Voice Hub GPUI beta'
            pub_date = [DateTime]::UtcNow.ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content "$executable.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$executable"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM gpui-latest.json

      - name: Package and attach GPUI beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "Voice-Hub-GPUI-Beta_${env:TAG}_windows-x86_64.zip"
          $executable = "Voice-Hub-GPUI_${env:TAG}_windows-x86_64.exe"
          New-Item -ItemType Directory -Path gpui-beta | Out-Null
          Copy-Item $executable gpui-beta/voice-hub-gpui-beta.exe
          Copy-Item "$executable.sig" gpui-beta/
          Copy-Item src-gpui/BETA.txt, LICENSE gpui-beta/
          New-Item -ItemType Directory -Path gpui-beta/native | Out-Null
          Copy-Item $env:APP_DECODER_ARCHIVE gpui-beta/native/
          $decoder = Split-Path $env:APP_DECODER_ARCHIVE -Leaf
          Copy-Item $env:APP_DECODER_ARCHIVE $decoder
          $metadata = cargo metadata --locked --format-version 1 --filter-platform $env:DESKTOP_TARGET --manifest-path src-gpui/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot collect dependency license notices' }
          foreach ($package in $metadata.packages) {
            if (-not $package.source) { continue }
            $directory = Split-Path $package.manifest_path
            $notices = Get-ChildItem $directory -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)(\b|[-_.])' }
            if ($notices) {
              $destination = "gpui-beta/licenses/$($package.name)-$($package.version)"
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $notices | Copy-Item -Destination $destination
            }
          }
          $nativeNotices = "gpui-beta/licenses/native-webrtc"
          New-Item -ItemType Directory -Path $nativeNotices -Force | Out-Null
          Get-ChildItem $env:LK_CUSTOM_WEBRTC -File -Recurse |
            Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)(\b|[-_.])' } |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($env:LK_CUSTOM_WEBRTC, $_.FullName)
              $target = Join-Path $nativeNotices $relative
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item $_.FullName $target
            }
          Compress-Archive -Path gpui-beta/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding utf8NoBOM "$archive.sha256"
          gh release upload "$env:TAG" $archive "$archive.sha256" $executable "$executable.sig" gpui-latest.json $decoder --repo "$env:REPO" --clobber

  publish-update-mirror:
    needs: [build-windows, build-gpui-beta]
    if: ${{ needs.build-windows.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vibes-group/deploy
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup-ssh
        with:
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir mirror
          gh release download "$TAG" --repo "$REPO" --dir mirror \
            --pattern 'latest.json' \
            --pattern 'gpui-latest.json' \
            --pattern 'ffmpeg-*.zip' \
            --pattern '*.exe'

          installer=$(jq -r '.platforms["windows-x86_64"].url | split("/")[-1]' mirror/latest.json)
          test -n "$installer"
          test -f "mirror/$installer"
          gpui=$(jq -r '.platforms["windows-x86_64"].url | split("/")[-1]' mirror/gpui-latest.json)
          test -n "$gpui"
          test -f "mirror/$gpui"

      - name: Publish server mirror
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          tar -C mirror -czf - . | ssh "deploy@$DEPLOY_HOST" \
            'docker run --rm -i -v voice-hub-updates:/updates busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e sh -eu -c '\''
              stage=$(mktemp -d)
              trap "rm -rf $stage" EXIT
              tar -xzf - -C "$stage"
              for file in "$stage"/*; do
                case "$(basename "$file")" in latest.json|gpui-latest.json) continue ;; esac
                cp "$file" /updates/
                chmod 0644 "/updates/$(basename "$file")"
              done
              for manifest in latest.json gpui-latest.json; do
                cp "$stage/$manifest" "/updates/.$manifest.tmp"
                chmod 0644 "/updates/.$manifest.tmp"
                mv "/updates/.$manifest.tmp" "/updates/$manifest"
              done
              for existing in /updates/*; do
                name=$(basename "$existing")
                case "$name" in latest.json|gpui-latest.json|ffmpeg-*.zip) continue ;; esac
                [ -f "$stage/$name" ] && continue
                rm -f "$existing"
              done
            '\'''
