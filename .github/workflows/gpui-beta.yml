name: GPUI Beta

on:
  push:
    paths:
      - 'src-gpui/**'
      - 'scripts/check-cargo-age.py'
      - 'scripts/prepare-webrtc.py'
      - 'backend/src/sfu/testdata/**'
      - '.github/workflows/gpui-beta.yml'
  pull_request:
    paths:
      - 'src-gpui/**'
      - 'scripts/check-cargo-age.py'
      - 'scripts/prepare-webrtc.py'
      - 'backend/src/sfu/testdata/**'
      - '.github/workflows/gpui-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (no tags upstream)
        with:
          toolchain: 1.99.1
      - name: Check dependency release ages
        run: python scripts/check-cargo-age.py src-gpui/Cargo.lock
      - name: Prepare verified native WebRTC SDK
        run: python scripts/prepare-webrtc.py --platform windows-x86_64 --github-env "$env:GITHUB_ENV"
      # CI caches never enter the signing/release job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-gpui
          shared-key: gpui-checks
          cache-on-failure: true
      - name: Find DirectX shader compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Windows SDK fxc.exe is required by GPUI' }
          "GPUI_FXC_PATH=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Check and test GPUI beta
        working-directory: src-gpui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build release binary
        working-directory: src-gpui
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release
          cargo test --locked --release -p grid@0.18.0
