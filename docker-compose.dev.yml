# LOCAL DEV ONLY — bound to 127.0.0.1, requires APP_ALLOW_INSECURE=1.
# Do not run on public hosts. Production layout: docker-compose.prod.yml.
name: voice-hub

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ADDR: ":8080"
      APP_WEB_DIR: "/app/web"
      APP_HOSTNAME: "localhost"
      PUBLIC_IP: "127.0.0.1"
      # Hash of the password "dev" (`$$` escapes `$` for compose); from cmd/hashpass.
      APP_ADMIN_PASSWORD_HASH: "argon2id$$t=2$$m=65536$$p=1$$W0B0JKkfebAQccnLyxFLzQ$$iIyiymTL21B6cCp53xsGzI/Vjm8v7V91UdNdoJvHt5w"
      APP_COOKIE_SECURE: "false"
      APP_ALLOW_INSECURE: "1"
    volumes:
      - app_data:/app/data
    # Port ranges follow backend defaults in internal/config/config.go
    # (UDP_PORT_MIN/MAX, TURN_RELAY_PORT_MIN/MAX). Keep these in sync.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:10101-10200:10101-10200/udp"
      - "127.0.0.1:49160-49199:49160-49199/udp"

volumes:
  app_data:
